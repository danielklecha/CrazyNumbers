name: Build Android

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: false
        default: '1.0.0'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. 1.0.0 or v1.0.0)'
        type: string
        required: false
        default: '1.0.0'

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v6

      - name: Replace Version in csproj files
        shell: bash
        run: |
          rawVersion="${{ inputs.version || github.ref_name }}"
          if [[ -z "$rawVersion" || ! "$rawVersion" =~ ^v?[0-9] ]]; then rawVersion="1.0.0"; fi
          tag=$(echo "$rawVersion" | sed 's/^v//')
          IFS='.' read -r major minor patch <<< "$tag"
          major="${major:-0}"
          minor="${minor:-0}"
          patch=$(echo "${patch:-0}" | grep -oE '^[0-9]+' || echo "0")
          app_version=$(( major * 1000000 + minor * 1000 + patch ))
          echo "Setting Version=${tag}, ApplicationDisplayVersion=${tag}, ApplicationVersion=${app_version}"
          find . -type f -name "*.csproj" -exec sed -i "s/<Version>.*<\/Version>/<Version>${tag}<\/Version>/g" {} \;
          find . -type f -name "*.csproj" -exec sed -i "s/<ApplicationDisplayVersion>.*<\/ApplicationDisplayVersion>/<ApplicationDisplayVersion>${tag}<\/ApplicationDisplayVersion>/g" {} \;
          find . -type f -name "*.csproj" -exec sed -i "s/<ApplicationVersion>.*<\/ApplicationVersion>/<ApplicationVersion>${app_version}<\/ApplicationVersion>/g" {} \;

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Install .NET MAUI Android Workload
        run: dotnet workload install maui-android

      - name: Restore Dependencies
        run: dotnet restore CrazyNumbers/CrazyNumbers.csproj

      - name: Decrypt Android Keystore
        shell: pwsh
        run: |
          $keystore_base64 = "${{ secrets.ANDROID_KEYSTORE_BASE64 }}"
          if ([string]::IsNullOrEmpty($keystore_base64)) {
              Write-Error "ANDROID_KEYSTORE_BASE64 secret is missing or empty!"
              exit 1
          }
          $keystore_bytes = [System.Convert]::FromBase64String($keystore_base64)
          New-Item -ItemType Directory -Force -Path "secrets"
          [System.IO.File]::WriteAllBytes("secrets/crazynumbers.keystore", $keystore_bytes)
          Write-Host "Keystore successfully decrypted and written to secrets/crazynumbers.keystore"

      - name: Publish Android App (AAB & APK)
        run: |
          dotnet publish CrazyNumbers/CrazyNumbers.csproj -f net10.0-android -c Release -p:AndroidKeyStore=true -p:AndroidSigningKeyStore=../secrets/crazynumbers.keystore -p:AndroidSigningKeyAlias="${{ secrets.ANDROID_KEY_ALIAS }}" -p:AndroidSigningKeyPass="${{ secrets.ANDROID_KEY_PASSWORD }}" -p:AndroidSigningStorePass="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"

      - name: Zip Android Native Symbols
        shell: pwsh
        run: |
          $symbolsPath = "CrazyNumbers/obj/Release/net10.0-android/app_shared_libraries"
          if (Test-Path $symbolsPath) {
              Compress-Archive -Path "$symbolsPath/*" -DestinationPath "CrazyNumbers-Android-Symbols.zip" -Force
              Write-Host "Android native symbols successfully zipped."
          } else {
              Write-Error "Android native symbols directory not found at $symbolsPath!"
              exit 1
          }

      - name: Prepare Android Artifacts
        run: |
          mkdir -p android-artifacts
          cp CrazyNumbers/bin/Release/net10.0-android/*-Signed.apk android-artifacts/
          cp CrazyNumbers/bin/Release/net10.0-android/*-Signed.aab android-artifacts/
          cp CrazyNumbers-Android-Symbols.zip android-artifacts/

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: android-assets
          path: android-artifacts/*
